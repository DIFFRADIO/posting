<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>DIFF Radio — Posting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#faf7f5; --surface:#fff; --surface2:#f3ece8; --line:#e2d7d0;
  --ink:#1a1512; --ink2:#6b5d55; --ink3:#9d8d83;
  --accent:#c2410c; --accent-soft:#fdeee4; --accent-line:#f0c4aa; --radius:3px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0b0a; --surface:#16120f; --surface2:#1f1915; --line:#2f2620;
  --ink:#f6f0eb; --ink2:#a89a91; --ink3:#756760;
  --accent:#ea580c; --accent-soft:#2b1409; --accent-line:#4a2512;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:38px 16px 80px}
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;padding-bottom:15px;border-bottom:2px solid var(--ink)}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 7px}
h1{font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(26px,4.5vw,36px);letter-spacing:-.02em;margin:0;line-height:1.05}
.tally{margin-left:auto;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.tally b{display:block;font-family:'Sora',sans-serif;font-size:21px;color:var(--ink);text-transform:none;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
h2{font-family:'Sora',sans-serif;font-weight:600;font-size:19px;margin:36px 0 0;padding-bottom:7px;border-bottom:1px solid var(--ink)}
h3{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:22px 0 2px}
.row{display:grid;grid-template-columns:24px 1fr 92px 150px;gap:0 14px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.n{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
.nm b{display:block;font-weight:500;font-size:15.5px}
.nm span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink3);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.off .nm b{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--accent-line)}
.dur{display:flex;align-items:center;gap:6px}
.dur input{width:50px;padding:6px 7px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);font-variant-numeric:tabular-nums}
.dur input:focus{border-color:var(--accent);outline:none}
.dur em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink3)}
.act{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.band{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);border-radius:2px;color:var(--ink3);white-space:nowrap}
.band.good{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.btn{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:6px 9px;border-radius:var(--radius);background:var(--surface);color:var(--ink2);border:1px solid var(--line);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.gate{max-width:360px;margin:16vh auto;padding:0 16px;text-align:center}
.gate p{color:var(--ink2);font-size:14px;margin:10px 0 18px}
.gate input{width:100%;padding:11px 12px;font-family:'IBM Plex Mono',monospace;font-size:15px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);text-align:center}
.gate button{margin-top:10px;width:100%;padding:11px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:var(--radius);cursor:pointer}
.err{color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:11.5px;margin-top:12px;min-height:16px}
.muted{color:var(--ink2);font-size:13px;margin:13px 0 0}
.foot{margin-top:42px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink2);font-size:13px}
.foot p{margin:0 0 7px;max-width:68ch}
.foot button{background:none;border:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
@media(max-width:640px){.row{grid-template-columns:22px 1fr;row-gap:9px}.dur,.act{grid-column:2}.act{justify-content:flex-start}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var SB  = "https://tgmpgjvvtyhtodltvhbz.supabase.co";
var KEY = "sb_publishable_-qU9zP_R-s1a6FX_X3PZRw_MGcFVBRK";
var LS  = "diff_posting_code";
var app = document.getElementById("app");
var code = null, clips = [];

function rpc(fn, body){
  return fetch(SB + "/rest/v1/rpc/" + fn, {
    method:"POST",
    headers:{ "apikey":KEY, "Authorization":"Bearer "+KEY, "Content-Type":"application/json" },
    body: JSON.stringify(body)
  }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function band(s){ if(!s) return null; s=+s;
  if(s<15) return {k:"",t:"under 15"};
  if(s<=25) return {k:"good",t:"15–25"};
  return {k:"",t:"over 25"}; }
var SRC = {interview:"Interview", performance:"Live performance", guest_mix:"Guest mix", station:"Station", other:"Other"};

function gate(msg){
  app.innerHTML =
    '<div class="gate"><p class="eyebrow">DIFF Radio</p><h1>Posting</h1>'+
    '<p>Enter your access code.</p>'+
    '<input id="c" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="code">'+
    '<button id="go">Open</button><div class="err">'+esc(msg||"")+'</div></div>';
  var i=document.getElementById("c");
  i.focus();
  function go(){ var v=i.value.trim(); if(!v) return;
    localStorage.setItem(LS,v); code=v; load(true); }
  document.getElementById("go").onclick=go;
  i.onkeydown=function(e){ if(e.key==="Enter") go(); };
}

function load(fromGate){
  rpc("posting_clips",{p_code:code}).then(function(rows){
    if(!rows || !rows.length){
      localStorage.removeItem(LS); code=null;
      gate(fromGate ? "Not recognised." : "");
      return;
    }
    clips = rows; render();
  }).catch(function(){
    app.innerHTML='<div class="wrap"><p class="muted">Couldn’t reach the database. Check your connection and reload.</p></div>';
  });
}

function render(){
  var done = clips.filter(function(c){return c.duration_seconds;}).length;
  var byArtist = {};
  clips.forEach(function(c){ (byArtist[c.artist_name] = byArtist[c.artist_name] || []).push(c); });

  var h = '<div class="wrap"><header class="mast"><div><p class="eyebrow">DIFF Radio · clip bank</p><h1>Posting</h1></div>'+
          '<div class="tally"><b>'+done+' / '+clips.length+'</b>durations in</div></header>';

  Object.keys(byArtist).sort().forEach(function(a){
    h += '<h2>'+esc(a)+'</h2>';
    var bySrc = {};
    byArtist[a].forEach(function(c){ (bySrc[c.source]=bySrc[c.source]||[]).push(c); });
    Object.keys(bySrc).sort().forEach(function(s){
      h += '<h3>'+esc(SRC[s]||s)+'</h3>';
      bySrc[s].forEach(function(c,i){
        var b = band(c.duration_seconds);
        h += '<div class="row'+(c.retired?' off':'')+'" data-id="'+esc(c.id)+'">'+
             '<div class="n">'+(i+1)+'</div>'+
             '<div class="nm"><b>'+esc(c.display_name)+'</b><span>'+esc(c.file_name)+'</span></div>'+
             '<div class="dur"><input type="number" min="1" max="600" inputmode="numeric" placeholder="–" value="'+
               (c.duration_seconds==null?"":esc(c.duration_seconds))+'" data-sec aria-label="Seconds"><em>s</em></div>'+
             '<div class="act">'+(b?'<span class="band '+b.k+'">'+b.t+'</span>':'')+
               (c.dropbox_url?'<a class="btn" href="'+esc(c.dropbox_url)+'" target="_blank" rel="noopener">Clip</a>':'')+
               '<button class="btn'+(c.retired?' on':'')+'" data-ret>'+(c.retired?"Used":"Use")+'</button>'+
             '</div></div>';
      });
    });
  });

  h += '<div class="foot">'+
       '<p>Listed filename ascending, the same order Dropbox shows them, so you can work top down. Everything saves as you type.</p>'+
       '<p><b>Clip</b> opens that file in Dropbox — download on laptop, Export › Save Video in the app on your phone. <b>Use</b> retires a clip so it stops reading as available.</p>'+
       '<p>Band is the one thing the numbers have proven: around 20 seconds averaged 895 views, around 50 seconds averaged 249. '+
       '<button id="out">Sign out</button></p></div></div>';
  app.innerHTML = h;
  document.getElementById("out").onclick=function(){ localStorage.removeItem(LS); code=null; gate(""); };
}

app.addEventListener("change", function(e){
  var el=e.target.closest("[data-sec]"); if(!el) return;
  var id=el.closest(".row").dataset.id, v=el.value.trim();
  var n = v===""? null : Math.max(1,Math.min(600,parseInt(v,10)||0))||null;
  rpc("posting_set_duration",{p_code:code,p_clip:id,p_seconds:n}).then(function(){
    clips.forEach(function(c){ if(c.id===id) c.duration_seconds=n; });
    render();
  });
});
app.addEventListener("click", function(e){
  var el=e.target.closest("[data-ret]"); if(!el) return;
  var row=el.closest(".row"), id=row.dataset.id;
  var cur=clips.filter(function(c){return c.id===id;})[0];
  rpc("posting_set_retired",{p_code:code,p_clip:id,p_retired:!cur.retired}).then(function(){
    cur.retired=!cur.retired; render();
  });
});

code = localStorage.getItem(LS);
if(code) load(false); else gate("");
</script>
</body>
</html>
