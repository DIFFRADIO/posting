<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>DIFF Radio — Posting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --mi:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-4.2-4.2'/></svg>");
  --bg:#faf7f5; --surface:#fff; --surface2:#f3ece8; --line:#e2d7d0;
  --ink:#1a1512; --ink2:#6b5d55; --ink3:#9d8d83;
  --accent:#c2410c; --accent-soft:#fdeee4; --accent-line:#f0c4aa; --radius:3px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0b0a; --surface:#16120f; --surface2:#1f1915; --line:#2f2620;
  --ink:#f6f0eb; --ink2:#a89a91; --ink3:#756760;
  --accent:#ea580c; --accent-soft:#2b1409; --accent-line:#4a2512;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:34px 16px 80px}
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 22px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 7px}
h1{font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(25px,4.5vw,34px);letter-spacing:-.02em;margin:0;line-height:1.05}
.tally{margin-left:auto;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.tally b{display:block;font-family:'Sora',sans-serif;font-size:20px;color:var(--ink);text-transform:none;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.back{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-decoration:none;margin-bottom:12px}
.back:hover{color:var(--accent)}
h2{font-family:'Sora',sans-serif;font-weight:600;font-size:18px;margin:32px 0 0;padding-bottom:7px;border-bottom:1px solid var(--ink)}
h3{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:22px 0 2px}
.tabs{display:flex;gap:2px;margin:16px 0 0;border-bottom:1px solid var(--line)}
.tabs button{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:10px 14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink3);cursor:pointer}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 4px}
.bar .sp{margin-left:auto}
select,input[type=time],input[type=date],input[type=text],input[type=number],textarea{font-family:'Archivo',sans-serif;font-size:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:7px 8px}
select:focus,input:focus,textarea:focus{border-color:var(--accent);outline:none}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

/* artist index */
.alist{margin-top:8px}
.acard{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);background:var(--surface);padding:15px 16px;margin:11px 0}
.acard:hover{border-color:var(--accent)}
.acard .an{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px}
.acard .an b{font-family:'Sora',sans-serif;font-weight:600;font-size:21px;letter-spacing:-.02em}
.acard .an em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);padding:2px 6px;border-radius:2px}
.acard .an em.next{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.acard .ad{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink2);margin-top:5px}
.acard .as{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.acard .as div{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.acard .as b{display:block;font-family:'Sora',sans-serif;font-size:17px;color:var(--ink);text-transform:none;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* clip rows */
.row{display:grid;grid-template-columns:24px 1fr 92px 170px;gap:0 14px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.n{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
.nm b{display:block;font-weight:500;font-size:15.5px}
.nm span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink3);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.off .nm b{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--accent-line)}
.dur{display:flex;align-items:center;gap:6px}
.dur input{width:50px;padding:6px 7px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:14px;font-variant-numeric:tabular-nums}
.act{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.band{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);border-radius:2px;color:var(--ink3);white-space:nowrap}
.band.good{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.btn{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:6px 9px;border-radius:var(--radius);background:var(--surface);color:var(--ink2);border:1px solid var(--line);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on:hover{color:#fff}

/* board */
.day{margin:24px 0 0}
.dayhd{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;padding:0 0 6px;border-bottom:1px solid var(--ink)}
.dayhd b{font-family:'Sora',sans-serif;font-weight:600;font-size:17px}
.dayhd em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.dayhd .sp{margin-left:auto}
.slot{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:12px;margin:10px 0}
.slot.q{border-left-color:var(--accent);background:var(--accent-soft)}
.slot.held{border-left-color:var(--ink3);opacity:.8}
.slot.skipped{opacity:.45}
.sl1{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:9px}
.fld{margin:8px 0 0}
.fld label{display:flex;align-items:baseline;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.fld label i{font-style:normal;font-variant-numeric:tabular-nums}
.fld label i.over{color:var(--accent)}
.fld label .sp{margin-left:auto}
.fld input[type=text],.fld textarea,.fld select{width:100%}
.fld textarea{min-height:66px;resize:vertical;line-height:1.4}
.why{margin:2px 0 10px;padding:10px 12px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);border-radius:var(--radius);font-size:13px;line-height:1.45}
.why b{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.why.note{border-color:var(--line);background:var(--surface2);color:var(--ink2)}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 0}
.tags select,.tags input{font-size:13px;padding:6px 7px}
.tags input.hk{flex:1 1 160px;min-width:120px}
.tx{margin:9px 0 0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface2)}
.tx summary{cursor:pointer;list-style:none;padding:8px 11px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:8px}
.tx summary::-webkit-details-marker{display:none}
.tx summary::before{content:"\25b8";font-size:9px;color:var(--ink3)}
.tx[open] summary::before{content:"\25be"}
.tx summary .sp{margin-left:auto}
.tx .body{padding:0 11px 11px}
.tx textarea{width:100%;min-height:120px;resize:vertical;font-size:13.5px;line-height:1.5}
.tx .src{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink3);margin:6px 0 0}
.tx .pn{font-size:13px;color:var(--ink2);margin:7px 0 0}
.tx .pn b{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:2px}

/* two sides */
.sidebar{display:flex;align-items:center;gap:12px;margin:0 0 20px;padding:9px 12px;border-radius:var(--radius);border:1px solid var(--line)}
.sidebar .home{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;text-decoration:none;color:var(--ink3)}
.sidebar .home:hover{color:var(--accent)}
.sidebar .now{font-family:'Sora',sans-serif;font-weight:600;font-size:13px;letter-spacing:-.01em}
.sidebar .bld{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;color:var(--ink3)}
.sidebar.a .bld{color:var(--ink3)}
.sidebar .swap{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;text-decoration:none;color:var(--ink2);border:1px solid var(--line);border-radius:2px;padding:5px 10px;background:var(--surface)}
.sidebar .swap:hover{border-color:var(--accent);color:var(--accent)}
.sidebar.c{background:var(--accent-soft);border-color:var(--accent-line)}
.sidebar.c .now{color:var(--accent)}
.sidebar.a{background:var(--ink);border-color:var(--ink)}
.sidebar.a .home,.sidebar.a .now{color:var(--bg)}
.sidebar.a .swap{background:transparent;border-color:var(--ink3);color:var(--bg)}
.sidebar.a .swap:hover{border-color:var(--bg);color:var(--bg)}
:root[data-side="analytics"] .mast{border-bottom-color:var(--ink3)}

.mast.big{border-bottom-width:2px;margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.halfc{display:flex;flex-direction:column;gap:7px;text-decoration:none;color:inherit;padding:22px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);min-height:230px}
.halfc:hover{border-color:var(--accent)}
.halfc .k{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.halfc b{font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(21px,3vw,27px);letter-spacing:-.02em;line-height:1.1}
.halfc p{margin:2px 0 0;color:var(--ink2);font-size:14px;line-height:1.45}
.halfc .st{margin-top:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.05em;color:var(--ink3);font-variant-numeric:tabular-nums}
.halfc .arr{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);margin-top:9px}
.halfc.create{border-left:4px solid var(--accent)}
.halfc.create .k{color:var(--accent)}
.halfc.analytics{border-left:4px solid var(--ink);background:var(--surface2)}
@media(max-width:700px){.two{grid-template-columns:1fr}.halfc{min-height:0}}

/* grid board */
.gwrap{overflow-x:auto;margin:14px 0 0;-webkit-overflow-scrolling:touch}
.grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);min-width:420px}
.grid>*{background:var(--surface)}
.gh{padding:9px 11px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink2);background:var(--surface2)}
.gh.day{font-family:'Sora',sans-serif;font-size:14px;letter-spacing:-.01em;text-transform:none;color:var(--ink)}
.gl{padding:10px 11px;background:var(--surface2);display:flex;flex-direction:column;justify-content:center;gap:1px}
.gl b{font-family:'Sora',sans-serif;font-size:12.5px}
.gl span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.gc{display:flex;flex-direction:column;gap:6px;text-align:left;border:0;width:100%;font:inherit;color:inherit;padding:10px 11px;min-height:80px;cursor:pointer;background:var(--surface)}
.gc:hover{background:var(--surface2)}
.gc.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.gc .cn{font-size:13px;line-height:1.3;font-weight:500}
.gc .cs{margin-top:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.04em;color:var(--ink3)}
.gc .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.gc.ok .dot{background:var(--accent)}
.gc.ok .cn{text-decoration:line-through;text-decoration-color:var(--accent-line);color:var(--ink2)}
.gc.dead .cn{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--accent-line)}
.gc .pl{font-style:normal;border:1px solid var(--line);border-radius:2px;padding:1px 5px}
.gc .pl.good{color:var(--accent);border-color:var(--accent-line)}
.gc.none{color:var(--ink3);font-family:'IBM Plex Mono',monospace;font-size:15px;align-items:center;justify-content:center;min-height:80px}
.gc.none:hover{color:var(--accent)}
.gsel{margin-top:16px}
.gsel .slot{margin:0}

.dtabs{display:flex;gap:6px;margin:14px 0 0;overflow-x:auto}
.dtabs .dt{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink2);cursor:pointer;white-space:nowrap}
.dtabs .dt.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media(max-width:640px){
  .sidebar{padding:7px 10px;gap:9px}
  .sidebar .home{display:none}
  .sidebar .now,.sidebar .bld,.sidebar .swap{white-space:nowrap}
  .sidebar .swap{padding:4px 8px}
  .mast{gap:8px 12px;padding-bottom:11px}
  .mast>div:first-child{flex:1 1 60%;min-width:0}
  .mast h1{font-size:26px}
  .tally{flex:0 0 auto}
  .tally b{font-size:17px}
  .grid{min-width:0}
  .gh{padding:7px 9px;font-size:9.5px}
  .gh.day{font-size:13px}
  .gl{padding:8px 9px}
  .gl b{font-size:11.5px}
  .gl span{font-size:10px}
  .gc{padding:9px;min-height:62px;gap:4px}
  .gc .cn{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .gc .cf{font-size:9.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .gc{min-height:70px}
  .gc .pl{display:none}
  .gc .cs{font-size:9px}
  .gc.none{min-height:62px}
  .mast .eyebrow{font-size:9.5px;letter-spacing:.09em}
  .setup{padding:11px}
  .setup p{font-size:12.5px}
}
.gc .cf{font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:1.35;color:var(--ink3);word-break:break-word}
.slim .ttl i{display:block;font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slim .ttl{white-space:normal}

/* campaign status */
:root{ --cs-done:#15803d; --cs-done-soft:#eaf6ee; --cs-done-line:#b7dcc3;
       --cs-sched:#1d4ed8; --cs-sched-soft:#eaf0fd; --cs-sched-line:#bdd0f6; }
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --cs-done:#4ade80; --cs-done-soft:#0e2117; --cs-done-line:#1f4a31;
  --cs-sched:#7aa2f7; --cs-sched-soft:#111b33; --cs-sched-line:#24386b; }}
:root[data-theme="dark"]{
  --cs-done:#4ade80; --cs-done-soft:#0e2117; --cs-done-line:#1f4a31;
  --cs-sched:#7aa2f7; --cs-sched-soft:#111b33; --cs-sched-line:#24386b; }
.tn.a0{border-left:3px solid transparent;padding-left:9px}
.tn.a0.cs-next{border-left-color:var(--accent)}
.tn.a0.cs-sched{border-left-color:var(--cs-sched)}
.tn.a0.cs-done{border-left-color:var(--cs-done)}
.tn.a0.cs-later{border-left-color:var(--line)}
.tn.a0.cs-later b{color:var(--ink2)}
.tag.st-next{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.tag.st-sched{color:var(--cs-sched);border-color:var(--cs-sched-line);background:var(--cs-sched-soft)}
.tag.st-done{color:var(--cs-done);border-color:var(--cs-done-line);background:var(--cs-done-soft)}
.tag.st-later{color:var(--ink3)}
.cbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:14px 0 0;padding:9px 12px;border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.cbar b{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.cbar .dotc{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.cbar.cs-next{border-left-color:var(--accent);background:var(--accent-soft)}
.cbar.cs-next b{color:var(--accent)} .cbar.cs-next .dotc{background:var(--accent)}
.cbar.cs-sched{border-left-color:var(--cs-sched);background:var(--cs-sched-soft)}
.cbar.cs-sched b{color:var(--cs-sched)} .cbar.cs-sched .dotc{background:var(--cs-sched)}
.cbar.cs-sched .btn.on{background:var(--cs-sched);border-color:var(--cs-sched);color:#fff}
.cbar.cs-done{border-left-color:var(--cs-done);background:var(--cs-done-soft)}
.cbar.cs-done b{color:var(--cs-done)} .cbar.cs-done .dotc{background:var(--cs-done)}
.cbar.cs-done .btn.on{background:var(--cs-done);border-color:var(--cs-done);color:#fff}
.cbar.cs-later b{color:var(--ink3)}
.tn.a0.cs-pool{border-left-color:var(--line)}
.tn.a0.cs-pool b{color:var(--ink2)}
.tag.st-pool{color:var(--ink3)}
.cbar.cs-pool b{color:var(--ink3)}
@media(max-width:640px){.cbar{padding:8px 10px;gap:7px}.cbar .btn{font-size:9.5px;padding:5px 8px}}
.empty{color:var(--ink2);font-size:13.5px;padding:13px 2px;border-bottom:1px solid var(--line)}
.setup{border:1px dashed var(--line);border-radius:var(--radius);padding:14px;margin:16px 0 0}
.setup p{margin:0 0 10px;color:var(--ink2);font-size:13.5px}

.gate{max-width:360px;margin:16vh auto;padding:0 16px;text-align:center}
.gate p{color:var(--ink2);font-size:14px;margin:10px 0 18px}
.gate input{width:100%;padding:11px 12px;font-family:'IBM Plex Mono',monospace;font-size:15px;text-align:center}
.gate button{margin-top:10px;width:100%;padding:11px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:var(--radius);cursor:pointer}
.gate .alt{margin:16px 0 0}
.gate .alt button{background:none;border:0;color:var(--ink3);font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;text-decoration:underline;cursor:pointer;padding:0}
.gate .alt button:hover{color:var(--accent)}
.gate button:disabled{opacity:.6;cursor:default}
.err{color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:11.5px;margin-top:12px;min-height:16px}
.muted{color:var(--ink2);font-size:13px;margin:13px 0 0;max-width:72ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0 0}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:12px}
.card b{display:block;font-family:'Sora',sans-serif;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}

.toast.show{opacity:1}
.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink2);font-size:13px}
.foot p{margin:0 0 7px;max-width:70ch}
.foot button{background:none;border:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer;padding:0}

/* tree */
.srch{position:relative;margin:16px 0 0}
.srch input{width:100%;padding:11px 12px 11px 34px;font-size:15px}
.srch::before{content:"";position:absolute;left:12px;top:50%;width:14px;height:14px;transform:translateY(-50%);opacity:.45;pointer-events:none;background:currentColor;color:var(--ink2);-webkit-mask:var(--mi) center/contain no-repeat;mask:var(--mi) center/contain no-repeat}
.tctl{display:flex;gap:8px;align-items:center;margin:10px 0 2px}
.tctl .sp{margin-left:auto}
.tree{margin-top:6px;border-top:1px solid var(--line)}
.tn{display:flex;align-items:center;gap:8px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.tn:hover{background:var(--surface2)}
.tn .car{flex:0 0 13px;font-size:10px;color:var(--ink3);transition:transform .14s;display:inline-block;text-align:center}
.tn.op .car{transform:rotate(90deg)}
.tn b{font-weight:600}
.tn .meta{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.tn .tag{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);border-radius:2px;color:var(--ink3)}
.tn .tag.next{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.tn.a0{padding:13px 6px;border-bottom:1px solid var(--ink)}
.tn.a0 b{font-family:'Sora',sans-serif;font-size:19px;letter-spacing:-.02em}
.tn.l1{padding-left:21px}
.tn.l2{padding-left:40px}
.tn.l1 b{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.tn.l2 b{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink2);text-transform:none}
.tn .open{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);border-radius:2px;padding:3px 7px}
.tn:hover .open{border-color:var(--accent);color:var(--accent)}
.kids{display:none}
.kids.op{display:block}
.row.l1{padding-left:21px}
.row.l2{padding-left:40px}
.slim{display:grid;grid-template-columns:52px 86px 1fr auto;gap:0 12px;align-items:center;padding:8px 6px 8px 40px;border-bottom:1px solid var(--line);cursor:pointer}
.slim:hover{background:var(--surface2)}
.slim .tm{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-variant-numeric:tabular-nums}
.slim .pf{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.slim .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.slim .ttl.none{color:var(--ink3);font-style:italic}
.slim .pill{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);border-radius:2px;color:var(--ink3)}
.slim .pill.q{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.nores{color:var(--ink2);font-size:13.5px;padding:18px 6px}
@media(max-width:640px){
  .tn.l2{padding-left:30px}.row.l2{padding-left:24px}
  .slim{grid-template-columns:48px 1fr auto;padding-left:30px}
  .slim .pf{display:none}
}
@media(max-width:640px){
  .wrap{padding-top:24px}
  .row{grid-template-columns:22px 1fr;row-gap:9px}
  .dur,.act{grid-column:2}.act{justify-content:flex-start}
  .tabs button{padding:9px 10px;font-size:10px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SB  = "https://tgmpgjvvtyhtodltvhbz.supabase.co";
var KEY = "sb_publishable_-qU9zP_R-s1a6FX_X3PZRw_MGcFVBRK";
var LS  = "diff_posting_code";
var BUILD = "2026-10-24d";

var code=null, clips=[], posts=[], releases=[];
var sb=null, session=null, me=null;
var REDIRECT = location.origin + location.pathname;
var side=null, view="choose", vArtist=null, vTab="board";
var fBand="", fSource="", fUnused=false;
var LSHOME="diff_posting_home";
var homeTab = localStorage.getItem(LSHOME)==="past" ? "past" : "now";
var LSGRID="diff_posting_grid";
var vGrid = localStorage.getItem(LSGRID)!=="0";
var selPost = null;
var dayIdx = 0;
function narrow(){ return !!(window.matchMedia && window.matchMedia("(max-width:640px)").matches); }
var LSOPEN="diff_posting_open";
var openN={}, q="";
try{ openN=JSON.parse(localStorage.getItem(LSOPEN)||"{}")||{}; }catch(e){ openN={}; }
function saveOpen(){ try{ localStorage.setItem(LSOPEN,JSON.stringify(openN)); }catch(e){} }
function isOpen(k){ return !!openN[k]; }

/* ---------- plumbing ---------- */
function rpc(fn, body){
  var tok = (session && session.access_token) || KEY;
  return fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:{apikey:KEY,Authorization:"Bearer "+tok,"Content-Type":"application/json"},
    body:JSON.stringify(body)}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function band(s){ if(!s) return null; s=+s;
  if(s<15) return {k:"",t:"under 15"};
  if(s<=25) return {k:"good",t:"15–25"};
  return {k:"",t:"over 25"}; }
function clipUrl(c){ if(!c) return null;
  if(c.dropbox_url) return c.dropbox_url;
  if(c.dropbox_path) return "https://www.dropbox.com/preview"+encodeURI(c.dropbox_path);
  return null; }
var SRC={interview:"Interview",performance:"Performance",guest_mix:"Guest mix",station:"Station",other:"Other"};
var PLAT={youtube:"YouTube",tiktok:"TikTok",instagram:"Instagram",spotify:"Spotify"};
var DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var MONS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* Agreed times, 24 Oct.
   Instagram 12:00 every day — against peak, but the field is quieter there and it
   leaves the whole day to push before the evening.
   Long form and Spotify 07:00. Evergreen YouTube short 12:00.
   Campaign YouTube short 19:00 Mon-Fri, 17:00 Sat, 19:30 Sun (on trial).
   TikTok 20:00 every day. */
function ytCampaign(dayIso){
  var p=String(dayIso).split("-");
  var k=new Date(+p[0],+p[1]-1,+p[2]).getDay();   // 0 Sun ... 6 Sat
  return k===0 ? "19:30" : (k===6 ? "17:00" : "19:00");
}
var SHAPES = {
  mix:    {label:"Launch \u00b7 mix",       build:function(d){ return [
            ["07:00","youtube"],["12:00","instagram"],["12:00","youtube"],
            [ytCampaign(d),"youtube"],["20:00","tiktok"]]; }},
  hoc:    {label:"Launch \u00b7 interview", build:function(d){ return [
            ["07:00","youtube"],["07:00","spotify"],["12:00","instagram"],["12:00","youtube"],
            [ytCampaign(d),"youtube"],["20:00","tiktok"]]; }},
  shorts: {label:"Shorts only",             build:function(d){ return [
            ["12:00","youtube"],[ytCampaign(d),"youtube"],["20:00","tiktok"]]; }},
  reel:   {label:"Shorts + reel",           build:function(d){ return [
            ["12:00","instagram"],["12:00","youtube"],[ytCampaign(d),"youtube"],["20:00","tiktok"]]; }}
};

var tEl=document.getElementById("toast"), tT=null;
function toast(m){ tEl.textContent=m; tEl.classList.add("show");
  clearTimeout(tT); tT=setTimeout(function(){tEl.classList.remove("show");},1500); }
function copy(txt,label){
  if(!txt){ toast("nothing to copy"); return; }
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(function(){toast(label+" copied");},function(){fb(txt,label);});
  else fb(txt,label);
}
function fb(txt,label){
  var a=document.createElement("textarea"); a.value=txt;
  a.style.position="fixed"; a.style.opacity="0"; document.body.appendChild(a); a.select();
  try{document.execCommand("copy"); toast(label+" copied");}catch(e){toast("copy failed");}
  document.body.removeChild(a);
}

/* ---------- dates: wall-clock strings, never parsed through Date ---------- */
function hhmm(ts){ return ts? String(ts).replace(" ","T").slice(11,16) : ""; }
function dayIsoOf(ts){ return ts? String(ts).replace(" ","T").slice(0,10) : null; }
function tsLocal(d,t){ return d+"T"+(t||"12:00")+":00"; }
function fmtDay(di){
  if(!di) return "";
  var p=di.split("-"), d=new Date(+p[0],+p[1]-1,+p[2]);
  return DAYS[(d.getDay()+6)%7]+" "+(+p[2])+" "+MONS[+p[1]-1];
}
function todayIso(){ var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

/* ---------- gate + load ---------- */
function gate(msg, mode){
  mode = mode || "email";
  var who = session && session.user ? session.user.email : null;
  var h='<div class="gate"><p class="eyebrow">DIFF Radio</p><h1>Posting</h1>';
  if(mode==="email"){
    h+='<p>Sign in and a link will arrive in your inbox.</p>'+
       '<input id="em" type="email" autocomplete="email" autocapitalize="off" spellcheck="false" '+
         'placeholder="you@diffradio.com" value="'+esc(who||"")+'">'+
       '<button id="go">Email me a link</button>'+
       '<div class="err">'+esc(msg||"")+'</div>'+
       '<p class="alt"><button id="useCode">Use an access code instead</button></p>';
  } else {
    h+='<p>Enter your access code.</p>'+
       '<input id="c" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="code">'+
       '<button id="go">Open</button>'+
       '<div class="err">'+esc(msg||"")+'</div>'+
       '<p class="alt"><button id="useEmail">Sign in by email instead</button></p>';
  }
  app.innerHTML = h + '</div>';

  if(mode==="email"){
    var e=document.getElementById("em"); e.focus();
    function send(){
      var v=e.value.trim();
      if(!v || v.indexOf("@")<0){ document.querySelector(".err").textContent="That isn\u2019t an email address."; return; }
      if(!sb){ document.querySelector(".err").textContent="Sign-in didn\u2019t load. Use an access code."; return; }
      var b=document.getElementById("go"); b.disabled=true; b.textContent="Sending\u2026";
      sb.auth.signInWithOtp({email:v, options:{emailRedirectTo:REDIRECT}}).then(function(r){
        if(r.error){ b.disabled=false; b.textContent="Email me a link";
          document.querySelector(".err").textContent=r.error.message||"Couldn\u2019t send it."; return; }
        app.innerHTML='<div class="gate"><p class="eyebrow">DIFF Radio</p><h1>Check your email</h1>'+
          '<p>A sign-in link is on its way to <b>'+esc(v)+'</b>. It expires in an hour \u2014 open it on the device you want to use.</p></div>';
      });
    }
    document.getElementById("go").onclick=send;
    e.onkeydown=function(ev){ if(ev.key==="Enter") send(); };
    document.getElementById("useCode").onclick=function(){ gate("","code"); };
  } else {
    var i=document.getElementById("c"); i.focus();
    function go(){ var v=i.value.trim(); if(!v) return; localStorage.setItem(LS,v); code=v; load(true); }
    document.getElementById("go").onclick=go;
    i.onkeydown=function(ev){ if(ev.key==="Enter") go(); };
    document.getElementById("useEmail").onclick=function(){ gate("","email"); };
  }
}
var app=document.getElementById("app");
function load(fromGate){
  Promise.all([rpc("posting_bank",{p_code:code}),rpc("posting_posts",{p_code:code}),rpc("posting_campaigns",{p_code:code})])
  .then(function(r){
    if(!r[0]||!r[0].length){ localStorage.removeItem(LS); code=null;
      gate(fromGate?(session?"That address isn\u2019t on the list.":"Not recognised."):"", session?"email":(fromGate?"code":"email")); return; }
    clips=r[0]; posts=r[1]||[]; releases=r[2]||[]; route();
  }).catch(function(){
    app.innerHTML='<div class="wrap"><p class="muted">Couldn’t reach the database. Check your connection and reload.</p></div>';
  });
}
function refresh(){ return rpc("posting_posts",{p_code:code}).then(function(r){posts=r||[];}); }

/* ---------- routing ---------- */
function route(){
  var h=(location.hash||"#/").replace(/^#/,"");
  var m=h.match(/^\/create\/artist\/([^\/]+)(?:\/(\w+))?/);
  if(m){ side="create"; view="artist"; vArtist=decodeURIComponent(m[1]); vTab=m[2]||"board"; }
  else if(h.indexOf("/create")===0){ side="create"; view="home"; vArtist=null; }
  else if(h.indexOf("/analytics")===0){ side="analytics"; view="numbers"; vArtist=null; }
  else { side=null; view="choose"; vArtist=null; }
  document.documentElement.setAttribute("data-side", side||"none");
  render();
}
window.addEventListener("hashchange",route);
var wasNarrow=narrow();
window.addEventListener("resize",function(){
  var n=narrow(); if(n!==wasNarrow){ wasNarrow=n; if(view!=="choose") render(); }
});

/* ---------- model helpers ---------- */
/* campaign colour: green done, blue scheduled, orange next two up, grey the rest */
function upNext(){
  var t=todayIso(), rows=[];
  artists().forEach(function(a){ var r=rel(a);
    if((r.campaign_status||"planned")!=="planned") return;
    var d=r.perf_date||r.interview_date;
    if(d&&d>=t) rows.push({a:a,d:d}); });
  rows.sort(function(x,y){ return x.d<y.d?-1:1; });
  return rows.slice(0,2).map(function(x){return x.a;});
}
/* An artist is past once their last dated drop has been and gone.
   No dates at all means they are here for the clip pool, which also lives in Past. */
function lastDate(a){ var r=rel(a);
  var d=[r.perf_date,r.interview_date].filter(Boolean).sort();
  return d.length ? d[d.length-1] : null; }
function nextDate(a){ var t=todayIso(), r=rel(a);
  var d=[r.perf_date,r.interview_date].filter(Boolean).sort()
        .filter(function(x){ return x>=t; });
  return d.length ? d[0] : null; }
function isPast(a){ var l=lastDate(a); return !l || l < todayIso(); }
function sortedArtists(past){
  return artists().filter(function(a){ return isPast(a)===past; })
    .sort(function(x,y){
      if(past){
        var lx=lastDate(x)||"0000", ly=lastDate(y)||"0000";
        if(lx!==ly) return ly<lx?-1:1;          /* most recent first */
      } else {
        var nx=nextDate(x)||"9999", ny=nextDate(y)||"9999";
        if(nx!==ny) return nx<ny?-1:1;          /* soonest first */
      }
      return x.toLowerCase().localeCompare(y.toLowerCase());
    });
}
function campaign(a){
  var r=rel(a), st=r.campaign_status||"planned";
  if(st==="complete")  return {k:"done", label:"Complete"};
  if(st==="scheduled") return {k:"sched",label:"Scheduled"};
  /* no dates and nothing scheduled: it is here for its clips, not a campaign */
  if(!r.perf_date && !r.interview_date && !postsOf(a).length)
    return {k:"pool", label:"Clip pool"};
  return upNext().indexOf(a)>=0 ? {k:"next", label:"Up next"} : {k:"later",label:"Later"};
}
function campaignBar(a){
  var st=(rel(a).campaign_status)||"planned", cp=campaign(a);
  var ps=postsOf(a), live=ps.filter(function(p){return p.status!=="skipped"&&p.status!=="held";});
  var q=live.filter(function(p){return p.status==="queued";}).length;
  var all = live.length>0 && q===live.length;
  return '<div class="cbar cs-'+cp.k+'">'+
    '<span class="dotc"></span><b>'+esc(cp.label)+'</b>'+
    '<span class="mono" style="font-size:10.5px;color:var(--ink3)">'+q+' of '+live.length+' slots queued'+
      (all&&st==="planned"?' \u00b7 all of them':'')+'</span>'+
    '<span style="margin-left:auto"></span>'+
    '<button class="btn cst'+(st==="scheduled"?" on":"")+'" data-st="'+(st==="scheduled"?"planned":"scheduled")+'">'+
      (st==="scheduled"?"Scheduled \u2713":"Mark campaign scheduled")+'</button>'+
    '<button class="btn cst'+(st==="complete"?" on":"")+'" data-st="'+(st==="complete"?"scheduled":"complete")+'">'+
      (st==="complete"?"Complete \u2713":"Mark complete")+'</button></div>';
}
function wireCampaign(a){
  document.querySelectorAll(".cst").forEach(function(b){
    b.onclick=function(){
      rpc("posting_set_campaign_status",{p_code:code,p_artist:a,p_status:b.dataset.st})
        .then(function(){ return rpc("posting_campaigns",{p_code:code}); })
        .then(function(r){ releases=r||[]; render(); toast("campaign "+b.dataset.st); })
        .catch(function(){ toast("save failed"); });
    };
  });
}
function rel(a){ for(var i=0;i<releases.length;i++) if(releases[i].artist_name===a) return releases[i]; return {}; }
function artists(){
  var s={}; clips.forEach(function(c){s[c.artist_name]=1;});
  releases.forEach(function(r){s[r.artist_name]=1;});
  posts.forEach(function(p){s[p.artist_name]=1;});
  return Object.keys(s);
}
function clipsOf(a){ return clips.filter(function(c){return c.artist_name===a;}); }
function postsOf(a){ return posts.filter(function(p){return p.artist_name===a;}); }

/* ---------- shell ---------- */
function render(){
  var h='<div class="wrap">';
  if(view!=="choose") h+=sideBar();
  if(view==="choose")  h+=chooseView();
  if(view==="home")    h+=homeView();
  if(view==="artist")  h+=artistView();
  if(view==="numbers") h+=numbersView();
  h+='<div class="foot"><p>Ticking a slot <b>queued</b> is the record — there is no second step. '+
     'Queued means it is sitting in the scheduler, not that it has gone out.</p>'+
     '<p>'+(me&&me.email?'<span class="mono" style="font-size:11px;color:var(--ink3)">'+esc(me.email)+' \u00b7 </span>':'')+'<button id="forget">'+(session?"Sign out":"Forget this device")+'</button>'+
     '<span class="mono" style="float:right;font-size:10px;color:var(--ink3)">build '+BUILD+'</span></p></div></div>';
  app.innerHTML=h;
  document.getElementById("forget").onclick=function(){
    localStorage.removeItem(LS);
    if(sb) sb.auth.signOut().then(function(){ location.reload(); }); else location.reload();
  };
  if(view==="choose") return;
  if(view==="home") wireTree();
  if(view==="artist"){ wireCampaign(vArtist); if(vTab==="board") wireBoard(); else wireClips(); }
}
function mast(eyebrow,title,tallyNum,tallyLabel){
  return '<header class="mast"><div><p class="eyebrow">'+esc(eyebrow)+'</p><h1>'+esc(title)+'</h1></div>'+
    (tallyNum!=null?'<div class="tally"><b>'+esc(tallyNum)+'</b>'+esc(tallyLabel)+'</div>':'')+'</header>';
}

/* ---------- the two sides ---------- */
function sideBar(){
  var ca = side==="create";
  return '<div class="sidebar '+(ca?"c":"a")+'">'+
    '<a class="home" href="#/" title="Both sides">DIFF Radio</a>'+
    '<span class="now">'+(ca?"Post creation":"Analytics")+'</span>'+
    '<span class="bld">'+BUILD+'</span>'+
    '<a class="swap" href="'+(ca?"#/analytics":"#/create")+'">'+
      (ca?"Analytics \u2192":"\u2190 Post creation")+'</a></div>';
}
function chooseView(){
  var planned=posts.filter(function(p){return p.status!=="queued"&&p.status!=="skipped";}).length;
  var q=posts.filter(function(p){return p.status==="queued";}).length;
  var unused=clips.filter(function(c){return (+c.used_count)===0&&!c.retired;}).length;
  var withUrl=posts.filter(function(p){return p.url;}).length;
  return '<header class="mast big"><div><p class="eyebrow">DIFF Radio</p><h1>Posting</h1></div></header>'+
   '<div class="two">'+
    '<a class="halfc create" href="#/create">'+
      '<span class="k">Post creation</span>'+
      '<b>Build the week</b>'+
      '<p>Clips by artist, the day-by-day board, titles and captions, and the queued tick.</p>'+
      '<span class="st">'+planned+' slot'+(planned===1?"":"s")+' still to fill \u00b7 '+unused+' clips never posted</span>'+
      '<span class="arr">Open \u2192</span></a>'+
    '<a class="halfc analytics" href="#/analytics">'+
      '<span class="k">Analytics</span>'+
      '<b>See what worked</b>'+
      '<p>What went out, what it did, and which titles, lengths and formats are actually earning views.</p>'+
      '<span class="st">'+q+' post'+(q===1?"":"s")+' queued \u00b7 '+withUrl+' with a live link</span>'+
      '<span class="arr">Open \u2192</span></a>'+
   '</div>'+

/* ---------- HOME: a tree, like the Dropbox folders ---------- */
function hit(v){ return q && String(v||"").toLowerCase().indexOf(q)>=0; }
function nextOut(){
  var today=todayIso(), best=null;
  artists().forEach(function(a){ var r=rel(a), d=r.perf_date||r.interview_date;
    if(d&&d>=today&&(!best||d<best.d)) best={a:a,d:d}; });
  return best?best.a:null;
}
/* what survives the search for one artist; null = artist drops out entirely */
function sift(a){
  var cs=clipsOf(a), ps=postsOf(a);
  if(!q || hit(a)) return {clips:cs, posts:ps, forced:!!q};
  var fc=cs.filter(function(c){ return hit(c.display_name)||hit(c.file_name)||hit(c.topic); });
  var fp=ps.filter(function(p){ return hit(p.title)||hit(p.caption)||hit(p.display_name)||hit(p.platform)||hit(p.status); });
  if(!fc.length && !fp.length) return null;
  return {clips:fc, posts:fp, forced:true};
}
function homeView(){
  return mast("DIFF Radio · social","Posting",null,null)+
    '<div class="srch"><input id="q" type="search" autocomplete="off" spellcheck="false" '+
      'placeholder="Search artists, clips, titles…" value="'+esc(q)+'"></div>'+
    '<div class="tctl">'+
      '<button class="btn'+(homeTab==="now"?" on":"")+'" id="tabNow">Current</button>'+
      '<button class="btn'+(homeTab==="past"?" on":"")+'" id="tabPast">Past</button>'+
      '<span style="width:10px;display:inline-block"></span>'+
    '<button class="btn" id="expAll">Expand all</button>'+
      '<button class="btn" id="colAll">Collapse all</button>'+
      '<span class="sp"></span></div>'+
    '<div id="tree">'+treeHtml()+'</div>';
}
function treeHtml(){
  var as = q ? artists() : sortedArtists(homeTab==="past");
  var nx=nextOut(), out="", shown=0;
  as.forEach(function(a){
    var f=sift(a); if(!f) return;
    shown++;
    var r=rel(a), k="a:"+a, op=isOpen(k)||f.forced;
    var dates=[];
    if(r.perf_date)      dates.push((r.perf_label||"Performance")+" "+fmtDay(r.perf_date));
    if(r.interview_date) dates.push("Interview "+fmtDay(r.interview_date));
    var qd=f.posts.filter(function(p){return p.status==="queued";}).length;

    var cp=campaign(a);
    out+='<div class="tn a0 cs-'+cp.k+(op?" op":"")+'" data-k="'+esc(k)+'">'+
      '<span class="car">▸</span><b>'+esc(a)+'</b>'+
      (r.episode_no?'<span class="tag">Ep. '+r.episode_no+'</span>':'')+
      '<span class="tag st-'+cp.k+'">'+esc(cp.label)+'</span>'+
      '<span class="meta">'+(dates.length?esc(dates.join("  ·  ")):"no dates")+'</span>'+
      '<span class="open" data-go="'+esc(a)+'">Open</span></div>'+
      '<div class="kids'+(op?" op":"")+'">'+artistKids(a,f,qd)+'</div>';
  });
  if(!shown) out = q
    ? '<p class="nores">Nothing matches \u201c'+esc(q)+'\u201d.</p>'
    : '<p class="nores">'+(homeTab==="past"?"No finished campaigns yet.":"Nothing coming up.")+'</p>';
  if(q) out = '<p class="nores" style="padding:10px 6px 2px">Searching everything, current and past.</p>'+out;
  return '<div class="tree">'+out+'</div>';
}
function artistKids(a,f,qd){
  var out="";
  /* board folder */
  var days={}; f.posts.forEach(function(p){ var d=dayIsoOf(p.scheduled_for)||"unscheduled";
    (days[d]=days[d]||[]).push(p); });
  var dk=Object.keys(days).sort();
  var bk="a:"+a+"/board", bop=isOpen(bk)||f.forced;
  out+='<div class="tn l1'+(bop?" op":"")+'" data-k="'+esc(bk)+'">'+
    '<span class="car">▸</span><b>Board</b>'+
    '<span class="meta">'+f.posts.length+' slot'+(f.posts.length===1?"":"s")+' · '+qd+' queued</span></div>'+
    '<div class="kids'+(bop?" op":"")+'">';
  if(!dk.length){
    out+='<p class="nores" style="padding-left:40px">No slots yet — open the artist to set a day up.</p>';
  }
  dk.forEach(function(d){
    var day=days[d].sort(function(x,y){return (x.scheduled_for||"").localeCompare(y.scheduled_for||"");});
    var dq=day.filter(function(p){return p.status==="queued";}).length;
    var k="a:"+a+"/board/"+d, op=isOpen(k)||f.forced;
    out+='<div class="tn l2'+(op?" op":"")+'" data-k="'+esc(k)+'">'+
      '<span class="car">▸</span><b>'+esc(d==="unscheduled"?"No date":fmtDay(d))+'</b>'+
      '<span class="meta">'+dq+' / '+day.length+' queued</span></div>'+
      '<div class="kids'+(op?" op":"")+'">';
    day.forEach(function(p){
      out+='<div class="slim" data-go="'+esc(a)+'">'+
        '<span class="tm">'+esc(hhmm(p.scheduled_for))+'</span>'+
        '<span class="pf">'+esc(PLAT[p.platform]||p.platform)+'</span>'+
        '<span class="ttl'+(p.title?"":" none")+'">'+esc(p.title||p.display_name||"empty slot")+
          (p.title&&p.display_name?'<i>'+esc(p.display_name)+'.mp4</i>':'')+'</span>'+
        '<span class="pill'+(p.status==="queued"?" q":"")+'">'+esc(p.status)+'</span></div>';
    });
    out+='</div>';
  });
  out+='</div>';

  /* clip folders, one per source */
  var byS={}; f.clips.forEach(function(c){ (byS[c.source]=byS[c.source]||[]).push(c); });
  Object.keys(byS).sort().forEach(function(sc){
    var list=byS[sc], k="a:"+a+"/src/"+sc, op=isOpen(k)||f.forced;
    var unused=list.filter(function(c){return (+c.used_count)===0;}).length;
    var inb=list.filter(function(c){return c.duration_band==="15_to_25";}).length;
    out+='<div class="tn l1'+(op?" op":"")+'" data-k="'+esc(k)+'">'+
      '<span class="car">▸</span><b>'+esc(SRC[sc]||sc)+'</b>'+
      '<span class="meta">'+list.length+' clips · '+inb+' in band · '+unused+' unposted</span></div>'+
      '<div class="kids'+(op?" op":"")+'">'+
      list.map(function(c,i){ return clipRow(c,i,"l2"); }).join("")+'</div>';
  });
  return out;
}

function bindTree(){
  document.querySelectorAll(".tn[data-k]").forEach(function(el){
    el.onclick=function(ev){
      var g=ev.target.closest("[data-go]");
      if(g){ location.hash="#/create/artist/"+encodeURIComponent(g.dataset.go); return; }

      var t=document.getElementById("tree");
      if(t){ t.innerHTML=treeHtml(); bindTree(); }
    };
  });

function wireClipRows(){
  document.querySelectorAll("input.d").forEach(function(el){
    el.onclick=function(ev){ ev.stopPropagation(); };
    el.onchange=function(){
      var v=el.value.trim()===""?null:parseInt(el.value,10);
      rpc("posting_set_duration",{p_code:code,p_clip:el.dataset.id,p_seconds:v}).then(function(){
        var c=clips.filter(function(x){return x.id===el.dataset.id;})[0];
        if(c){ c.duration_seconds=v;
          c.duration_band=v==null?null:(v<15?"under_15":(v<=25?"15_to_25":"over_25")); }
        var t=document.getElementById("tree");
        if(t){ t.innerHTML=treeHtml(); bindTree(); } else render();
      }).catch(function(){ toast("save failed"); });
    };
  });
  document.querySelectorAll("button.ev").forEach(function(el){
    el.onclick=function(ev){
      ev.stopPropagation();
      var want = el.dataset.v==="true";
      rpc("posting_set_clip_text",{p_code:code,p_clip:el.dataset.id,p_field:"is_evergreen",p_value:el.dataset.v})
        .then(function(){
          var c=clips.filter(function(x){return x.id===el.dataset.id;})[0];
          if(c) c.is_evergreen=want;
          var t=document.getElementById("tree");
          if(t){ t.innerHTML=treeHtml(); bindTree(); } else render();
        }).catch(function(){ toast("save failed"); });
    };
  });
  document.querySelectorAll("button.r").forEach(function(el){
    el.onclick=function(ev){
      ev.stopPropagation();
      var want=el.dataset.r==="1";
      rpc("posting_set_retired",{p_code:code,p_clip:el.dataset.id,p_retired:want}).then(function(){
        var c=clips.filter(function(x){return x.id===el.dataset.id;})[0];
        if(c) c.retired=want;
        var t=document.getElementById("tree");
        if(t){ t.innerHTML=treeHtml(); bindTree(); } else render();
      }).catch(function(){ toast("save failed"); });
    };
  });
  document.querySelectorAll(".row a.btn").forEach(function(el){
    el.onclick=function(ev){ ev.stopPropagation(); };
  });
}

/* the grid: days across, platform+time down, one cell per slot */
function gridView(a,days,keys){
  var ps=postsOf(a);
  var rowsMap={};
  ps.forEach(function(p){
    var k=hhmm(p.scheduled_for)+"|"+p.platform;
    rowsMap[k]=[hhmm(p.scheduled_for), p.platform];
  });
  var rows=Object.keys(rowsMap).sort().map(function(k){return rowsMap[k];});
  if(!selPost || !ps.filter(function(p){return p.id===selPost;}).length)
    selPost = ps.filter(function(p){return p.status!=="skipped";})[0] ?
              ps.filter(function(p){return p.status!=="skipped";})[0].id : (ps[0]&&ps[0].id);

  var sm=narrow();
  if(dayIdx>keys.length-1) dayIdx=0;
  var cols = sm ? [keys[dayIdx]] : keys;

  var h='';
  if(sm && keys.length>1){
    h+='<div class="dtabs">'+keys.map(function(d,i){
      return '<button class="dt'+(i===dayIdx?" on":"")+'" data-day="'+i+'">'+
        esc(d==="unscheduled"?"No date":fmtDay(d))+'</button>';}).join("")+'</div>';
  }
  h+='<div class="gwrap"><div class="grid" style="grid-template-columns:'+
        (sm?'70px':'104px')+' repeat('+cols.length+',minmax('+(sm?'0':'190px')+',1fr))">'+
        '<div class="gh corner"></div>';
  cols.forEach(function(d){ h+='<div class="gh day">'+esc(d==="unscheduled"?"No date":fmtDay(d))+'</div>'; });
  rows.forEach(function(rw){
    h+='<div class="gl"><b>'+esc(PLAT[rw[1]]||rw[1])+'</b><span>'+esc(rw[0])+'</span></div>';
    cols.forEach(function(d){
      var p=ps.filter(function(x){ return dayIsoOf(x.scheduled_for)===d &&
        hhmm(x.scheduled_for)===rw[0] && x.platform===rw[1]; })[0];
      if(!p){
        h+='<button class="gc none" type="button" data-add="'+esc(d)+'|'+esc(rw[0])+'|'+esc(rw[1])+'">+</button>';
        return;
      }
      var b=band(p.duration_seconds);
      var cls='gc'+(p.status==="queued"?" ok":"")+(p.status==="skipped"||p.status==="held"?" dead":"")+(p.id===selPost?" sel":"");
      h+='<button class="gc '+cls.slice(3)+'" type="button" data-sel="'+p.id+'">'+
         '<span class="cn">'+esc(p.title||p.display_name||"empty slot")+'</span>'+
         (p.title&&p.display_name?'<span class="cf">'+esc(p.display_name)+'.mp4</span>':'')+
         '<span class="cs"><i class="dot"></i>'+
           (p.duration_seconds? p.duration_seconds+"s" : "no length")+
           (b&&b.k==="good"?'<i class="pl good">in band</i>':(b?'<i class="pl">'+b.t+'</i>':''))+
           (p.status!=="planned"?'<i class="pl'+(p.status==="queued"?" good":"")+'">'+esc(p.status)+'</i>':'')+
         '</span></button>';
    });
  });
  h+='</div></div>';

  var cur=ps.filter(function(p){return p.id===selPost;})[0];
  if(cur) h+='<div class="gsel">'+slotCard(cur)+'</div>';
  return h;
}

    (p.clip_id?'<details class="tx" data-c="'+p.clip_id+'"><summary>Clip transcript'+
      '<span class="sp"></span><span class="ld">load</span></summary>'+
      '<div class="body"><em style="font-style:normal;color:var(--ink3);font-size:13px">\u2026</em></div></details>':'')+
  '</div>';
}
function sel2(cls,label,opts,val){
  return '<select class="'+cls+'"><option value="">'+esc(label)+'\u2026</option>'+
    opts.map(function(o){return '<option value="'+o+'"'+(val===o?" selected":"")+'>'+
      o.charAt(0).toUpperCase()+o.slice(1)+'</option>';}).join("")+'</select>';
}
function chk(cls,label,val){
  return '<button class="btn '+cls+(val?' on':'')+'" data-v="'+(val?"1":"0")+'">'+esc(label)+'</button>';
}
function saveSlot(el,reload){
  var cur=posts.filter(function(p){return p.id===el.dataset.p;})[0];
  var day=dayIsoOf(cur.scheduled_for)||todayIso();
  var sel=el.querySelector(".cl").value;
  function v(c){ var e=el.querySelector("."+c); return e?e.value:null; }
  function b(c){ var e=el.querySelector("."+c); return e? (e.dataset.v==="1") : null; }
  var d={ clip_id:sel||null,
    scheduled_for:tsLocal(day, el.querySelector(".t").value||"12:00"),
    platform:el.querySelector(".pl").value,
    title:el.querySelector(".ti").value,
    caption:el.querySelector(".ca").value,
    url:v("ur"),
    format:v("fm")||null, title_form:v("tf")||null, topic:v("hk")||null,
    addresses_viewer:b("av"), open_loop:b("ol"), asked_a_question:b("aq"),
    status:el.querySelector(".stx").value };
  if(!sel){ d.artist_name=cur.artist_name; d.source=cur.source; }
  return rpc("posting_save_post",{p_code:code,p_id:el.dataset.p,p_data:d})
    .then(function(){ toast("saved"); if(reload) return refresh().then(render); })
    .catch(function(){ toast("save failed"); });
}
function addSlots(dayIso,specs){
  var a=vArtist, r=rel(a), cs=clipsOf(a);
  var src = (dayIso===r.interview_date) ? "interview"
          : (dayIso===r.perf_date ? (cs.filter(function(c){return c.source!=="interview";})[0]||{}).source || "performance"
          : (cs[0]?cs[0].source:"interview"));
  var jobs=specs.map(function(s){
    return rpc("posting_save_post",{p_code:code,p_id:null,p_data:{
      scheduled_for:tsLocal(dayIso,s[0]), platform:s[1],
      artist_name:a, source:src, status:"planned"}});
  });
  Promise.all(jobs).then(refresh).then(render).catch(function(){ toast("couldn’t add"); });
}
function wireBoard(){
  document.querySelectorAll(".mkday").forEach(function(b){
    b.onclick=function(){ addSlots(b.dataset.d, SHAPES[b.dataset.s||"shorts"].build(b.dataset.d)); };
  });
  document.querySelectorAll(".addOne").forEach(function(b){
    b.onclick=function(){ addSlots(b.dataset.d,[["12:00","instagram"]]); };
  });
  document.querySelectorAll(".shp").forEach(function(b){
    b.onclick=function(){
      var d=b.dataset.d;
      if(d==="__new__"){ var nd=document.getElementById("newDay"); if(!nd||!nd.value) return; d=nd.value; }
      addSlots(d, SHAPES[b.dataset.s].build(d));
    };
  });
  var nd=document.getElementById("newDay");
  var ns=document.getElementById("newSlot");
  if(ns) ns.onclick=function(){ if(nd&&nd.value) addSlots(nd.value,[[ytCampaign(nd.value),"youtube"]]); };

  var vg=document.getElementById("vG"), vc=document.getElementById("vC");
  if(vg) vg.onclick=function(){ vGrid=true;  localStorage.setItem(LSGRID,"1"); render(); };
  if(vc) vc.onclick=function(){ vGrid=false; localStorage.setItem(LSGRID,"0"); render(); };
  document.querySelectorAll("[data-sel]").forEach(function(b){
    b.onclick=function(){ selPost=b.dataset.sel; render();
      var g=document.querySelector(".gsel"); if(g) g.scrollIntoView({block:"nearest"}); };
  });
  document.querySelectorAll("[data-day]").forEach(function(b){
    b.onclick=function(){ dayIdx=+b.dataset.day; render(); };
  });
  document.querySelectorAll("[data-add]").forEach(function(b){
    b.onclick=function(){ var q=b.dataset.add.split("|"); addSlots(q[0],[[q[1],q[2]]]); };
  });
  document.querySelectorAll(".slot").forEach(function(el){
    el.querySelector(".cl").onchange=function(){ saveSlot(el,true); };
    el.querySelector(".pl").onchange=function(){ saveSlot(el,true); };
    el.querySelector(".t").onchange =function(){ saveSlot(el,true); };
    el.querySelector(".ti").onblur  =function(){ saveSlot(el,false); };
    el.querySelector(".ca").onblur  =function(){ saveSlot(el,false); };
    el.querySelector(".ti").oninput =function(){
      var i=el.querySelector(".fld i"); if(!i) return;
      var n=el.querySelector(".ti").value.length;
      i.textContent=n+"/60"; i.className=n>60?"over":"";
    };
    ["ur","hk"].forEach(function(c){ var e=el.querySelector("."+c); if(e) e.onblur=function(){ saveSlot(el,false); }; });
    ["fm","tf"].forEach(function(c){ var e=el.querySelector("."+c); if(e) e.onchange=function(){ saveSlot(el,false); }; });
    ["av","ol","aq"].forEach(function(c){ var e=el.querySelector("."+c); if(e) e.onclick=function(ev){
      ev.preventDefault();
      e.dataset.v = e.dataset.v==="1" ? "0" : "1";
      e.classList.toggle("on", e.dataset.v==="1");
      saveSlot(el,false); }; });
    var tx=el.querySelector("details.tx");
    if(tx) tx.addEventListener("toggle",function(){ if(tx.open) loadTx(tx); });
    el.querySelector(".cpT").onclick=function(e){ e.preventDefault(); copy(el.querySelector(".ti").value,"Title"); };
    el.querySelector(".cpC").onclick=function(e){ e.preventDefault(); copy(el.querySelector(".ca").value,"Caption"); };
    el.querySelector(".stx").onchange=function(){ setStatus(el,el.querySelector(".stx").value); };
    el.querySelector(".st").onclick =function(){
      var cur=posts.filter(function(x){return x.id===el.dataset.p;})[0];
      setStatus(el, cur.status==="queued"?"planned":"queued");
    };
  });
}
function loadTx(d){
  if(d.dataset.loaded) return;
  d.dataset.loaded="1";
  var body=d.querySelector(".body");
  rpc("posting_clip_text",{p_code:code,p_clip:d.dataset.c}).then(function(r){
    var c=(r&&r[0])||{};
    body.innerHTML =
      '<textarea class="txa" placeholder="paste the transcript for this clip">'+esc(c.transcript||"")+'</textarea>'+
      (c.transcript_source?'<p class="src">'+esc(c.transcript_source)+'</p>':'')+
      '<div class="pn"><b>Names mentioned</b>'+
        '<input type="text" class="pna" style="width:100%" value="'+esc(c.proper_nouns||"")+'" '+
        'placeholder="people, venues, labels said out loud in this clip"></div>';
    var ta=body.querySelector(".txa"), pn=body.querySelector(".pna");
    ta.onblur=function(){ setClipText(d.dataset.c,"transcript",ta.value); };
    pn.onblur=function(){ setClipText(d.dataset.c,"proper_nouns",pn.value); };
    var ld=d.querySelector(".ld"); if(ld) ld.textContent = c.transcript ? "stored" : "empty";
  }).catch(function(){ body.textContent="Couldn't load the transcript."; d.dataset.loaded=""; });
}
function setClipText(clip,field,value){
  rpc("posting_set_clip_text",{p_code:code,p_clip:clip,p_field:field,p_value:value})
    .then(function(){ toast(field==="transcript"?"transcript saved":"names saved"); })
    .catch(function(){ toast("save failed"); });
}
function setStatus(el,st){
  rpc("posting_set_post_status",{p_code:code,p_id:el.dataset.p,p_status:st})
    .then(refresh).then(render).catch(function(){ toast("save failed"); });
}

/* ---------- ARTIST: clips ---------- */
function clipsView(a){
  var list=clipsOf(a).filter(function(c){
    if(fSource&&c.source!==fSource) return false;
    if(fBand&&c.duration_band!==fBand) return false;
    if(fUnused&&(+c.used_count)>0) return false;
    return true; });
  var srcs={}; clipsOf(a).forEach(function(c){srcs[c.source]=1;});
  var h='<div class="bar">'+
    '<select id="fSource"><option value="">All sources</option>'+
      Object.keys(srcs).map(function(k){return '<option value="'+k+'"'+(fSource===k?" selected":"")+'>'+(SRC[k]||k)+'</option>';}).join("")+'</select>'+
    '<select id="fBand"><option value="">Any length</option>'+
      [["under_15","Under 15s"],["15_to_25","15–25s"],["over_25","Over 25s"]].map(function(p){
        return '<option value="'+p[0]+'"'+(fBand===p[0]?" selected":"")+'>'+p[1]+'</option>';}).join("")+'</select>'+
    '<button class="btn'+(fUnused?" on":"")+'" id="fUnused">Never posted</button>'+
    '<span class="sp mono" style="font-size:11px;color:var(--ink3)">'+list.length+' of '+clipsOf(a).length+'</span></div>';
  if(!list.length) return h+'<p class="empty">Nothing matches those filters.</p>';
  var byS={}; list.forEach(function(c){ (byS[c.source]=byS[c.source]||[]).push(c); });
  Object.keys(byS).sort().forEach(function(s){
    h+='<h3>'+esc(SRC[s]||s)+'</h3>';
    byS[s].forEach(function(c,i){ h+=clipRow(c,i,""); });
  });
  return h;
}
function wireClips(){
  var s=document.getElementById("fSource"), b=document.getElementById("fBand"), u=document.getElementById("fUnused");
  if(s) s.onchange=function(){ fSource=s.value; render(); };
  if(b) b.onchange=function(){ fBand=b.value; render(); };
  if(u) u.onclick=function(){ fUnused=!fUnused; render(); };
  wireClipRows();
}

/* ---------- NUMBERS ---------- */
function numbersView(){
  var used=clips.filter(function(c){return (+c.used_count)>0;}).length;
  var inBand=clips.filter(function(c){return c.duration_band==="15_to_25";}).length;
  var noDur=clips.filter(function(c){return !c.duration_seconds;}).length;
  var q=posts.filter(function(p){return p.status==="queued";}).length;
  var h=''+
    mast("DIFF Radio · social","Numbers",posts.length,"slots on the board")+
    '<h2>Where this stands</h2><div class="cards">'+
    card(q,"ticked queued")+card(clips.length-used,"clips never posted")+
    card(inBand+" / "+clips.length,"clips 15–25s")+card(noDur,"clips with no length")+'</div>';
  if(posts.length){
    var byP={},byB={};
    posts.forEach(function(p){ byP[p.platform]=(byP[p.platform]||0)+1;
      var k=p.duration_band||"unknown"; byB[k]=(byB[k]||0)+1; });
    h+='<h3>By platform</h3><div class="cards">'+Object.keys(byP).map(function(k){return card(byP[k],PLAT[k]||k);}).join("")+'</div>';
    h+='<h3>By length band</h3><div class="cards">'+Object.keys(byB).map(function(k){
      return card(byB[k], k==="15_to_25"?"15–25s":(k==="under_15"?"under 15s":(k==="over_25"?"over 25s":"no length")));}).join("")+'</div>';
  }
  h+='<h2>What the numbers already say</h2>'+
    '<p class="muted">Counted by hand from earlier episodes, before this app existed. Leads, not verdicts — small samples, different artists.</p>'+
    find("Length is the strongest signal so far","Three clips around 20 seconds averaged 895 views. Three around 50 seconds averaged 249. Two different artists, same direction. People leave at roughly 12–14 seconds whatever the clip’s length, so a 50-second clip just reports a worse percentage.")+
    find("Second person beats third person","“The text you keep not sending” outperformed the “he did X” shape by a wide margin — 728 views against 83 on comparable clips.")+
    find("An open loop beats a closed statement","The best-performing title on the channel is the only one that is not a complete sentence. A title that answers itself gives nobody a reason to watch.")+
    find("Borrowed names travel","A title naming three well-known artists did 1,389 views and was never repeated. Worth testing properly — Frey’s batch has one sitting in it.")+
    find("Sunday and Wednesday, 09:00–10:00","The drop slots. Instagram Reels at 12:00; TikTok being tested at 18:00 and 20:00.")+
    '<h2>Not here yet</h2>'+
    find("Views, retention and the rest","None of it is read automatically. YouTube Analytics is the first API to wire in — richest data, clearest path. TikTok and Instagram both need app approval, which takes weeks and isn’t guaranteed. Spotify has no creator analytics API at all and stays a manual export, permanently.")+
    find("Anything crossing gender × length × topic × format","Months away. Starting clean from Frey means starting at zero — the deliberate trade for not inventing history.");
  return h;
}
function card(n,l){ return '<div class="card"><b>'+esc(n)+'</b><span>'+esc(l)+'</span></div>'; }
function find(t,p){ return '<div class="find"><b>'+esc(t)+'</b><p>'+esc(p)+'</p></div>'; }

/* ---------- boot ---------- */
function boot(){
  code = localStorage.getItem(LS);
  if(!(window.supabase && window.supabase.createClient)){
    if(code) load(false); else gate("Sign-in didn\u2019t load \u2014 use your access code.","code");
    return;
  }
  sb = window.supabase.createClient(SB, KEY, {
    auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:"diff_posting_auth" }
  });
  sb.auth.onAuthStateChange(function(_e, sess){ session = sess || null; });
  sb.auth.getSession().then(function(r){
    session = (r && r.data && r.data.session) || null;
    if(history.replaceState && location.hash.indexOf("access_token")>=0)
      history.replaceState(null,"",location.pathname+location.search);
    if(session) return rpc("posting_me",{}).then(function(rows){
      me = (rows&&rows[0])||null;
      if(me && me.ok){ code=null; load(false); }
      else { sb.auth.signOut(); session=null;
             gate("That address isn\u2019t on the list. Ask Matt to add it.","email"); }
    });
    if(code) load(false); else gate("","email");
  }).catch(function(){
    if(code) load(false); else gate("","email");
  });
}
boot();
</script>
